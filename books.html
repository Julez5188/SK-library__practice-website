<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://kit.fontawesome.com/8c2874cba0.js" crossorigin="anonymous"></script>
</head>

<body id="books__body">
  <section>
    <nav>
      <div class="nav__container">
        <div class="nav__logo--wrapper">
          <img class="logo__img" src="./assets/sk-logo.jpg">
          <h4>SK Library</h4>
        </div>
        <ul class="nav__links">
          <a href="index.html" class="nav__link">Home</a>
          <a class="nav__link no-cursor">Contact</a>
          <a href=""></a>
        </ul>
        <button class="btn__menu" onclick="openMenu()">
          <i class="fas fa-bars"></i>
        </button>
        <div class="menu__backdrop" style="visibility:hidden;">
          <button class="btn__menu btn__menu--close" onclick="closeMenu()">
            <i class="fas fa-times"></i>
          </button>
          <ul class="menu__links">
            <li class="menu__list">
              <a href="#" class="menu__link" onclick="closeMenu()">Home</a>
            </li>
            <li class="menu__list">
              <a href="index.html#features" class="menu__link" onclick="closeMenu()">Popular Books</a>
            </li>
            <li class="menu__list">
              <a class="menu__link no-cursor">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </section>

  <main id="books__main">
    <section>
      <div class="conatiner">
        <div class="row">
          <div class="books__header">
            <h2 class="section__title books__header--title">
              All <span class="red">Books</span>
            </h2>
            <select id="filter" onchange="filterBooks(event)">
              <option value="disabled selected">Sort</option>
              <option value="A_TO_Z">Alphabetical</option>
              <option value="NEWEST_TO_OLDEST">Newest to oldest</option>
              <option value="LOW_TO_HIGH">Price, low to high</option>
              <option value="HIGH_TO_LOW">Price, High to Low</option>
            </select>
          </div>
          <div class="books books__loading">
            <i class="fas fa-spinner books__loading--spinner"></i>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="index.js"></script>
  <script src="books.js"></script>
</body>
</html>
