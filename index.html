<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK Bookstore</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://kit.fontawesome.com/8c2874cba0.js" crossorigin="anonymous"></script>
</head>
<body>
  <section id="landing">
    <nav>
      <div class="nav__container">
        <div class="nav__logo--wrapper">
          <img class="logo__img" src="./assets/sk-logo.jpg">
          <h4>SK Bookstore</h4>
        </div>
        <ul class="nav__links">
          <a href="#" class="nav__link">Home</a>
          <a href="#" class="nav__link">Browse Books</a>
          <a href="#" class="nav__link">Contact</a>
        </ul>
      </div>
    </nav>
    <header>
      <div class="header__container">
        <div class="header__description">
          <h1>North America's Best Stephen King Bookstore</h1>
          <h2>Find your next thriller with <span class="red">SK Bookstore</span></h2>
          <a href="#features">
            <button class="btn">Browse Books</button>
          </a>
        </div>
        <figure class="header__img--wrapper">
          <img src="./assets/sk_header-img.jpg">
        </figure>
      </div>
    </header>
  </section>

  <main>
    <section id="highlights">
      <div class="container">
        <div class="row">
          <h2 class="section__title">

          </h2>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
